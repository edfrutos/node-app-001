name: github-release

on:
  push:
    tags:
      - "v*"

# Necesario para consultar runs de otros workflows y crear el release
permissions:
  contents: write
  actions: read

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Wait for build-and-scout success for this tag
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const sha = context.sha;

            // 1) Encuentra el workflow "build-and-scout" (por nombre)
            const workflows = await github.rest.actions.listRepoWorkflows({ owner, repo });
            const wf = workflows.data.workflows.find(w => w.name === 'build-and-scout');
            if (!wf) {
              core.setFailed('No encuentro el workflow "build-and-scout" en este repo.');
              return;
            }

            // 2) Poll hasta que exista un run para este SHA y termine
            const maxAttempts = 30;          // ~10 min
            const delayMs = 20_000;          // 20s

            function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

            let lastConclusion = null;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const runsResp = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: wf.id,
                per_page: 30,
              });

              const run = runsResp.data.workflow_runs.find(r => r.head_sha === sha);
              if (!run) {
                core.info(`[gate] (${attempt}/${maxAttempts}) Aún no hay run de build-and-scout para sha=${sha}. Espero...`);
                await sleep(delayMs);
                continue;
              }

              core.info(`[gate] Encontrado run id=${run.id} status=${run.status} conclusion=${run.conclusion}`);

              if (run.status !== 'completed') {
                core.info(`[gate] (${attempt}/${maxAttempts}) build-and-scout aún en progreso. Espero...`);
                await sleep(delayMs);
                continue;
              }

              lastConclusion = run.conclusion;
              if (run.conclusion !== 'success') {
                core.setFailed(`build-and-scout no fue success (conclusion=${run.conclusion}). No creo el release ${tag}.`);
                return;
              }

              // OK
              core.setOutput('tag', tag);
              core.setOutput('sha', sha);
              core.setOutput('run_url', run.html_url);
              core.info(`[gate] OK ✅ build-and-scout success. Continuamos a crear el release ${tag}.`);
              return;
            }

            core.setFailed(`Timeout esperando a build-and-scout para sha=${sha} (última conclusion=${lastConclusion}).`);

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.gate.outputs.tag }}
          target_commitish: ${{ steps.gate.outputs.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false