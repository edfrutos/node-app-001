name: build-and-scout

on:
  # 1) CI en pushes a main (integración) y tags semver (releases)
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  # 2) Validación en PRs contra main
  pull_request:
    branches:
      - main
  # 3) Manual
  workflow_dispatch:

# Evita runs simultáneos del mismo ref (opcional pero recomendable)
concurrency:
  group: build-and-scout-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos; Scout puede comentar en PR si se permite
permissions:
  contents: read
  pull-requests: write

env:
  IMAGE_NAME: edefrutos/node-app-001

jobs:
  build-scan-push:
    name: build-scan-push
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 1) Checkout
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # 2) QEMU + Buildx (multi-arch)
      # -------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------
      # 3) Login Docker Hub (NO en PR)
      # -------------------------
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------
      # 4) Metadata: tags/labels coherentes
      #    - vX.Y.Z cuando llega tag
      #    - latest sólo en main
      # -------------------------
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

      # -------------------------
      # 5A) Build en PR: imagen local (sin push)
      #    - UNA sola arquitectura
      #    - load:true para Scout local://
      # -------------------------
      - name: Build (PR -> local image)
        if: github.event_name == 'pull_request'
        id: build_pr
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------
      # 5B) Build+Push en main/tags: multi-arch a registry
      # -------------------------
      - name: Build & Push (main/tags -> registry)
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------
      # 6A) Scout en PR (local://)
      #    Política: HIGH + only-fixed + ignore-base + npm-only
      #    Nota: comentar en PR solo si NO viene de fork
      # -------------------------
      - name: "Scout CVEs (PR: HIGH, fixed only, npm only, ignore base)"
        if: github.event_name == 'pull_request'
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          only-severities: high
          only-fixed: true
          ignore-base: true
          only-package-types: npm
          summary: true
          exit-code: true
          write-comment: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------
      # 6B) Scout en main/tags (registry por digest)
      #    OJO: digest SIEMPRE con @
      # -------------------------
      - name: "Scout CVEs (main/tags: HIGH, fixed only, npm only, ignore base)"
        if: github.event_name != 'pull_request'
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          only-severities: high
          only-fixed: true
          ignore-base: true
          only-package-types: npm
          summary: true
          exit-code: true
          write-comment: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
