name: build-and-scout

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  IMAGE_NAME: edefrutos/node-app-001

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "TAGS=${{ env.IMAGE_NAME }}:${VERSION},${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT
            echo "SCAN_IMAGE=${{ env.IMAGE_NAME }}:${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "TAGS=${{ env.IMAGE_NAME }}:main" >> $GITHUB_OUTPUT
            echo "SCAN_IMAGE=${{ env.IMAGE_NAME }}:main" >> $GITHUB_OUTPUT
          fi

      - name: Build and push (with SBOM + provenance)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.TAGS }}
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max

      - name: Scout CVEs (high only)
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE_NAME }}:${{ steps.build.outputs.digest }}
          only-severities: high
          exit-code: true
          format: table
          github-token: ${{ secrets.GITHUB_TOKEN }}
          write-comment: true
