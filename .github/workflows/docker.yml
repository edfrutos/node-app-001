name: Build, Scan and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"          # Releases semver (v0.1.0, v1.0.1, etc)
  workflow_dispatch:

env:
  IMAGE_NAME: edefrutos/node-app-001

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write   # NECESARIO para SBOM y provenance

    steps:
      # ------------------------------------------------------------------
      # 1️⃣ Checkout del código
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2️⃣ Habilitar QEMU (multi-arch: amd64 + arm64)
      # ------------------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ------------------------------------------------------------------
      # 3️⃣ Habilitar Docker Buildx
      # ------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------------
      # 4️⃣ Login en Docker Hub
      # ------------------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------------------------------------
      # 5️⃣ Generar metadata (tags y labels)
      # ------------------------------------------------------------------
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=sha

      # ------------------------------------------------------------------
      # 6️⃣ Build + Push (SBOM + provenance)
      # ------------------------------------------------------------------
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      # ------------------------------------------------------------------
      # 7️⃣ Docker Scout — POLÍTICA DECIDIDA
      #
      # ✔ Solo paquetes npm
      # ✔ Solo vulnerabilidades HIGH
      # ✔ Solo si existe FIX
      # ✖ Ignora SO base (Debian)
      # ✔ Escanea la imagen EXACTA (digest)
      # ------------------------------------------------------------------
      - name: Scout CVEs (npm only, fixed only)
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          only-severities: high
          only-fixed: true
          package-managers: npm
          summary: true
          exit-code: true
          write-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}