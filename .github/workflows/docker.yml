name: build-and-scout

on:
  # 1) CI en pushes a main (integración) y tags semver (releases)
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  # 2) Validación en PRs contra main (antes de merge)
  pull_request:
    branches:
      - main

  # 3) Manual
  workflow_dispatch:

# Evita runs simultáneos del mismo ref (recomendable)
concurrency:
  group: build-and-scout-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos; en PRs puede comentar (si no viene de fork)
permissions:
  contents: read
  pull-requests: write

env:
  IMAGE_NAME: edefrutos/node-app-001
  # política npm-only: npm audit se ejecuta siempre en PR y también en main/tags (rápido)
  NODE_ENV: production

jobs:
  build-scan-push:
    name: build-scan-push
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 1) Checkout
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # 2) Node para npm audit (política npm-only)
      #    Esto evita depender de Scout en PRs.
      # -------------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Instala dependencias (usa package-lock.json)
      - name: Install dependencies
        run: npm ci

      # Gate npm-only (realista y estándar)
      # --omit=dev: solo producción
      # --audit-level=high: falla si hay HIGH o CRITICAL en npm
      - name: npm audit (prod only, fail on high)
        run: npm audit --omit=dev --audit-level=high

      # -------------------------
      # 3) QEMU + Buildx (multi-arch)
      # -------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------
      # 4) Login Docker Hub (NO en PR)
      # -------------------------
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------
      # 5) Metadata: tags/labels coherentes
      #    - vX.Y.Z cuando llega tag
      #    - latest sólo en main
      # -------------------------
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

      # -------------------------
      # 6A) Build en PR: imagen local (sin push)
      #     - UNA sola arquitectura (ubuntu runner = amd64)
      #     - load:true => imagen disponible local://
      #     - SIN attestations (provenance/sbom) para evitar conflictos con --load
      # -------------------------
      - name: Build (PR -> local image)
        if: github.event_name == 'pull_request'
        id: build_pr
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------
      # 6B) Build+Push en main/tags: multi-arch a registry
      #     - Attestations ON para Scout por digest
      # -------------------------
      - name: Build & Push (main/tags -> registry)
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------
      # 7) Docker Scout SOLO en main/tags
      #    Motivo: en PR te fallaba por entitlement (“githubactions not entitled…”)
      #    Política:
      #      - only-severities: high
      #      - only-fixed: true
      #      - ignore-base: true (ignora CVEs del SO/base)
      #      - only-package-types: npm (npm-only)
      #    Se analiza por DIGEST => SIEMPRE con @
      # -------------------------
      - name: "Scout CVEs (main/tags: HIGH, fixed only, npm only, ignore base)"
        if: github.event_name != 'pull_request'
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          only-severities: high
          only-fixed: true
          ignore-base: true
          only-package-types: npm
          summary: true
          exit-code: true
          write-comment: false
          github-token: ${{ secrets.GITHUB_TOKEN }}