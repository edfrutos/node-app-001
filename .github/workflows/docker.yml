name: build-and-scout

on:
  # CI en main + releases semver
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  # Validación en PRs contra main
  pull_request:
    branches:
      - main
  # Ejecución manual
  workflow_dispatch:

# Evita ejecuciones simultáneas del mismo ref
concurrency:
  group: build-and-scout-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos
permissions:
  contents: read
  pull-requests: write

env:
  # Repo Docker Hub confirmado
  IMAGE_NAME: edefrutos/node-app-001

jobs:
  build-scan-push:
    name: build-scan-push
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 1) Checkout
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # PR: política "npm-only" REALISTA (sin Docker Scout)
      # - Ejecuta npm audit (prod only) y construye Docker (amd64)
      # - Así NO dependes de Docker Scout entitlement en PR
      # ==========================================================
      - name: Set up Node (PR)
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (PR)
        if: github.event_name == 'pull_request'
        run: npm ci

      # Falla si hay HIGH o CRITICAL en dependencias de producción
      - name: npm audit (PR, prod only, fail on high)
        if: github.event_name == 'pull_request'
        run: npm audit --omit=dev --audit-level=high

      # Build Docker en PR (sin push, una sola arquitectura)
      # Nota: NO usamos cache-to porque el driver docker no lo soporta sin push
      - name: Docker build (PR, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha

      # ==========================================================
      # main/tags: build+push multi-arch + Scout (npm-only)
      # ==========================================================
      - name: Set up QEMU (main/tags)
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx (main/tags)
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub (main/tags)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags/labels coherentes:
      # - vX.Y.Z cuando llega un tag
      # - latest solo en main
      - name: Docker meta (main/tags)
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Build+Push multi-arch y con attestation (SBOM/provenance)
      - name: Build & Push (main/tags -> registry)
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scout SOLO en main/tags, por DIGEST (siempre con @)
      # Política: HIGH + only-fixed + ignore-base + npm-only
      - name: "Scout CVEs (main/tags: HIGH, fixed only, npm only, ignore base)"
        if: github.event_name != 'pull_request'
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          only-severities: high
          only-fixed: true
          ignore-base: true
          only-package-types: npm
          summary: true
          exit-code: true
          write-comment: false
          github-token: ${{ secrets.GITHUB_TOKEN }}