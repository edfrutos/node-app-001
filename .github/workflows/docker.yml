name: build-and-scout

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  pull-requests: write

env:
  # Cambia "node-app-001" si el repo es otro
  IMAGE_NAME: edefrutos/node-app-001

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Genera tags/labels automáticamente:
      # - En main: latest
      # - En tags vX.Y.Z: X.Y.Z y vX.Y.Z (según config)
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push (SBOM + provenance max)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Escaneo por DIGEST (inmutable, no por tag).
      # Política CVE: solo HIGH y solo si tienen fix => el OS "not fixed" no rompe el pipeline.
      - name: Scout CVEs (high, fixed only)
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          only-severities: high
          only-fixed: true
          exit-code: true
          summary: true
          format: json
          write-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}