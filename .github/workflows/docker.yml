name: build-and-scout

on:
  # CI en main + releases semver
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  # Validación en PRs contra main
  pull_request:
    branches: ["main"]
  # Ejecución manual
  workflow_dispatch:

# Evita ejecuciones simultáneas del mismo ref
concurrency:
  group: build-and-scout-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos (para leer repo y, si algún día lo habilitas, comentar en PR)
permissions:
  contents: read
  pull-requests: write

env:
  IMAGE_NAME: edefrutos/node-app-001

jobs:
  build-scan-push:
    name: build-scan-push
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 1) Checkout
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # PR: política "npm-only" (realista) + build docker sin push
      # - No depende de Docker Scout (evita problemas de entitlement)
      # - Gate: tests + audit (prod only, high)
      # ==========================================================
      - name: Set up Node (PR)
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (PR)
        if: github.event_name == 'pull_request'
        run: npm ci

      - name: Run tests (PR)
        if: github.event_name == 'pull_request'
        run: npm test

      - name: Smoke (PR)
        if: github.event_name == 'pull_request'
        run: npm run smoke

      - name: Smoke (PR)
        if: github.event_name == 'pull_request'
        run: npm run smoke

      - name: npm audit (PR, prod only, fail on high)
        if: github.event_name == 'pull_request'
        run: npm audit --omit=dev --audit-level=high

      - name: Set up Docker Buildx (PR)
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Docker build (PR, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: false
          provenance: false
          sbom: false

      # ==========================================================
      # main/tags: build+push multi-arch + SBOM/provenance + Scout
      # ==========================================================
      - name: Set up Node (main/tags)
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (main/tags)
        if: github.event_name != 'pull_request'
        run: npm ci

      - name: Run tests (main/tags)
        if: github.event_name != 'pull_request'
        run: npm test

      - name: Smoke (main/tags)
        if: github.event_name != 'pull_request'
        run: npm run smoke

      - name: Smoke (main/tags)
        if: github.event_name != 'pull_request'
        run: npm run smoke

      - name: Smoke (PR)
        if: github.event_name == 'pull_request'
        run: npm run smoke

      - name: Set up QEMU (main/tags)
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx (main/tags)
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub (main/tags)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (main/tags)
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Tag exacto cuando llega vX.Y.Z
            type=ref,event=tag
            # latest sólo en main
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build & Push (main/tags -> registry)
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestations para Scout (SBOM + provenance)
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Scout CVEs (main/tags: HIGH, fixed only, npm only, ignore base)"
        if: github.event_name != 'pull_request'
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          only-severities: high
          only-fixed: true
          ignore-base: true
          only-package-types: npm   # ← AQUÍ
          summary: true
          exit-code: true
          write-comment: false
          github-token: ${{ secrets.GITHUB_TOKEN }}