name: build-and-scout

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*" # releases semver: v0.1.0, v0.1.1, v1.0.0...
  workflow_dispatch:

env:
  IMAGE_NAME: edefrutos/node-app-001

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      # 1) Código
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Buildx (multi-arch + attestations)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3) Login Docker Hub (secrets del repo)
      #    DOCKERHUB_USERNAME = edefrutos
      #    DOCKERHUB_TOKEN    = access token
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4) Tags automáticos:
      #    - main -> latest
      #    - tag vX.Y.Z -> X.Y.Z y latest (según config)
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      # 5) Build + Push + SBOM + provenance=max
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6) Scout (política npm-only REALISTA)
      #    - Escaneamos la imagen exacta construida (por digest), no un tag que pueda apuntar a otra cosa.
      #    - Solo HIGH
      #    - Solo con fix disponible
      #    - Solo gestor npm (ignora SO/base: gpgv, libc, etc.)
      - name: Scout CVEs (HIGH, fixed only, npm only)
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          only-severities: high
          only-fixed: true
          package-managers: npm
          summary: true
          exit-code: true
          write-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}